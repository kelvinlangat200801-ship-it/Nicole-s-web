<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>For Nicole ❤️</title><style>body{margin:0;background:#ffedf2;font-family:sans-serif;text-align:center;overflow:hidden}h1{margin-top:60px;font-size:2.5em;color:#e91e63}p{font-size:1.2em;color:#555;padding:0 20px}.heart{font-size:80px;animation:beat 1s infinite}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}button{padding:15px 30px;font-size:18px;border:none;border-radius:30px;background:#e91e63;color:white;margin:10px}#no{position:absolute}</style></head><body><div class="heart">❤️</div><h1>Hey Nicole!</h1><p>You are my favorite notification,<br>my favorite thought,<br>and my favorite person.</p><p><b>Will you be mine forever?</b></p><button onclick="yes()">YES! ❤️</button><button id="no" onmouseover="move()">No</button><script>function yes(){document.body.innerHTML="<h1 style='margin-top:100px'>Yay! I knew it! ❤️<br> I Love You Nicole!!!</h1><div class='heart'>💖💖💖</div><p>You just made me the happiest!</p>"}function move(){let b=document.getElementById('no');b.style.left=Math.random()*80+'%';b.style.top=Math.random()*80+'%';}</script></body></html>
